  <script>
    let soundEnabled = true;
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playSound(type) {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;
        if (type === 'correct') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.15);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        } else if (type === 'wrong') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.setValueAtTime(180, now + 0.1);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        }
      } catch(e) {}
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('soundToggle').innerText = soundEnabled ? '🔊 Âm thanh: Bật' : '🔇 Âm thanh: Tắt';
    }

          "Thành lập tổ chức Liên hợp quốc nhằm duy trì hòa bình, an ninh thế giới.",

      },
      {
        id: 2,
        question: "Mục tiêu và nguyên tắc hoạt động của tổ chức Liên hợp quốc đều được quy định rõ trong văn kiện nào sau đây?",
        options: [
          "Hiến chương Liên hợp quốc.",
          "Tuyên ngôn về thủ tiêu hoàn toàn chủ nghĩa thực dân.",
          "Tuyên ngôn Quốc tế về Nhân quyền.",
          "Công ước Liên hợp quốc về Luật biển."
        ],
        answer: 0,
        explain: "Hiến chương Liên hợp quốc là văn kiện nền tảng pháp lý quốc tế tối cao, quy định đầy đủ các mục tiêu và nguyên tắc hoạt động của Liên hợp quốc."
      },
      {
        id: 3,
        question: "Nội dung nào sau đây không phản ánh đúng bối cảnh lịch sử hình thành tổ chức Liên hợp quốc?",
        options: [

          "Ý thức của các nước Đồng minh về việc tổ chức thế giới.",

        ],

      },
      {
        id: 4,
        question: "Liên hợp quốc có vai trò thúc đẩy phát triển hợp tác quốc tế về",
        options: [
          "liên minh quân sự.",

    let toastTimeout = null;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      if (!toast) return;
      toast.innerHTML = msg;
      toast.classList.add('show');
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 3200);
    }

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function toggleShuffle() {
      autoShuffle = !autoShuffle;
      const btn = document.getElementById('shuffleToggle');
      if (autoShuffle) {

        showToast('🔀 Đã BẬT tự xáo đề (Tự động xáo ngẫu nhiên sau mỗi lượt hoàn thành)');
      } else {
        btn.classList.remove('active');
        btn.innerText = '⏸ Tự xáo đề: TẮT';
        showToast('⏸ Đã TẮT tự xáo đề (Giữ nguyên thứ tự câu hỏi & đáp án)');
      }
    }

      if (tag) tag.innerText = `Mã đề: ${currentExamCode}`;

    function generateExamSession(isShuffle = true, silent = false) {
      if (isShuffle) {
        // Sinh ngẫu nhiên mã đề 4 chữ số (ví dụ 0145, 0628, 0931...)
        const randCode = Math.floor(100 + Math.random() * 900);
        currentExamCode = '0' + randCode;

        // Nhân bản sâu danh sách câu hỏi và xáo trộn các đáp án A, B, C, D
        let cloned = QUIZ_DATA.map(q => {
          const correctText = q.options[q.answer];
          let shuffledOptions = [...q.options];
          shuffleArray(shuffledOptions);
          const newAnswerIdx = shuffledOptions.indexOf(correctText);

          return {
            ...q,
            originalId: q.id,
            options: shuffledOptions,
            answer: newAnswerIdx
          };
        });

        // Xáo trộn thứ tự các câu hỏi
        shuffleArray(cloned);
        activeQuizData = cloned;

        if (!silent) {
          showToast(`🎲 Đã tạo <b>Mã đề ${currentExamCode}</b>! Đã xáo ngẫu nhiên 24 câu hỏi & các đáp án A, B, C, D.`);
        }
      } else {
        // Giữ nguyên thứ tự gốc
        currentExamCode = '0003';
        activeQuizData = QUIZ_DATA.map(q => ({
          ...q,
          originalId: q.id,
          options: [...q.options],
          answer: q.answer
        }));
      }

      currentQIndex = 0;
      score = 0;
      userAnswers = {};
      updateExamBadge();
    }

        generateExamSession(true, false);
        if (currentTab === 'quiz') {
          renderQuizQuestion();
        } else {
          switchTab('quiz');

      }
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (window.event && window.event.target && window.event.target.classList) {
        window.event.target.classList.add('active');
      }

      const progressEl = document.getElementById('progressContainer');
      const statusEl = document.getElementById('statusBar');

      if (tab === 'quiz') {
        progressEl.style.display = 'block';
        statusEl.style.display = 'flex';
        renderQuizQuestion();
      } else if (tab === 'tf') {
        progressEl.style.display = 'block';
        statusEl.style.display = 'flex';
        renderTrueFalse();
      } else if (tab === 'flash') {
        progressEl.style.display = 'none';
        statusEl.style.display = 'none';
        renderFlashcards();
      } else if (tab === 'mistakes') {
        progressEl.style.display = 'none';
        statusEl.style.display = 'none';
        renderMistakes();
      }
    }

          </div>
          <div class="nav-controls">
            <button class="btn btn-outline" onclick="prevQuestion()" ${currentQIndex === 0 ? 'disabled' : ''}>⬅ Câu trước</button>
            <button class="btn btn-primary" onclick="nextQuestion()">
              ${currentQIndex === activeQuizData.length - 1 ? 'Xem kết quả 🏁' : 'Câu tiếp theo ➡'}
            </button>
          </div>
        </div>
      `;
    }

    function handleOptionSelect(selectedIdx) {
      const q = activeQuizData[currentQIndex];
      userAnswers[currentQIndex] = selectedIdx;

      if (selectedIdx === q.answer) {
        score++;
        playSound('correct');
      } else {
        playSound('wrong');
        if (!mistakeList.includes(q.originalId)) {
          mistakeList.push(q.originalId);
          document.getElementById('mistakeTab').innerText = `🔄 Câu Làm Sai (${mistakeList.length})`;
        }
      }

      renderQuizQuestion();
    }

    function prevQuestion() {
      if (currentQIndex > 0) {
        currentQIndex--;
        renderQuizQuestion();
      }
    }

    function nextQuestion() {
      if (currentQIndex < activeQuizData.length - 1) {
        currentQIndex++;
        renderQuizQuestion();
      } else {
        renderQuizResult();
      }
    }

    function renderQuizResult() {
      const percent = Math.round((score / activeQuizData.length) * 100);
      let title = "Rất xuất sắc! 🎉";
      let desc = "Bạn đã nắm cực chắc 100% nội dung ôn tập Lịch sử!";
      if (percent < 50) {
        title = "Cần cố gắng thêm một chút! 💪";
        desc = "Hãy đọc phần 'Học Mẹo Từ Khóa' và thử luyện lại những câu sai nhé.";
      } else if (percent < 85) {
        title = "Kết quả rất tốt! 👏";
        desc = "Bạn đã nắm khá vững, luyện thêm 1 lần nữa là đạt điểm 10 trọn vẹn!";
      }

      document.getElementById('quizArea').innerHTML = `
        <div class="card result-box">
          <div style="display:inline-block; font-size:13px; color:var(--primary-light); font-weight:700; margin-bottom:8px; text-transform:uppercase; letter-spacing:0.5px; background:rgba(79,70,229,0.15); padding:4px 12px; border-radius:999px;">
            🏁 Hoàn thành Lượt thi #${roundCount} &bull; Mã đề ${currentExamCode}
          </div>
          <div class="result-score">${score}/${activeQuizData.length}</div>
          <div class="result-title">${title}</div>
          <div class="result-desc">${desc} (Tỉ lệ chính xác: ${percent}%)</div>

          <div style="background:rgba(255,255,255,0.03); border:1px solid var(--card-border); border-radius:var(--radius-sm); padding:14px; margin-bottom:20px; font-size:13.5px; color:var(--text-muted);">
            ${autoShuffle 
              ? '✨ <b>Chế độ Tự xáo đề đang BẬT:</b> Bấm nút dưới để tạo ngay một mã đề mới hoàn toàn ngẫu nhiên và bắt đầu lượt làm tiếp theo!' 
              : '⏸ <b>Chế độ Tự xáo đề đang TẮT:</b> Giữ nguyên thứ tự câu hỏi và đáp án cho lượt sau.'}
          </div>

          <div style="display:flex; justify-content:center; gap:12px; flex-wrap:wrap;">
            <button class="btn btn-primary" onclick="handleFinishAndNextRound()">
              🎲 ${autoShuffle ? 'Xáo đề ngẫu nhiên & Làm lượt mới ➡' : 'Làm lại lượt mới ➡'}
            </button>
            <button class="btn btn-outline" onclick="restartSameExam()">🔄 Làm lại mã đề này (${currentExamCode})</button>
            ${mistakeList.length > 0 ? `<button class="btn btn-outline" onclick="switchTab('mistakes')">Xem ${mistakeList.length} câu làm sai</button>` : ''}
            <button class="btn btn-outline" onclick="switchTab('tf')">Chuyển sang phần Đúng/Sai ➡</button>
          </div>
        </div>
      `;
    }

    function handleFinishAndNextRound() {
      roundCount++;
      generateExamSession(autoShuffle, false);
      renderQuizQuestion();
    }

    function restartSameExam() {
      currentQIndex = 0;
      score = 0;
      userAnswers = {};
      showToast(`🔄 Làm lại <b>Mã đề ${currentExamCode}</b> (Giữ nguyên cấu trúc đề hiện tại)`);
      renderQuizQuestion();
    }

    function restartQuiz() {
      if (autoShuffle) {
        handleFinishAndNextRound();
      } else {
        restartSameExam();
      }
    }

    function generateTFSession(isShuffle = true, silent = false) {
      const labels = ['a', 'b', 'c', 'd'];
      let cloned = TF_DATA.map(p => {
        let clonedItems = p.items.map(item => ({
          ...item,
          uid: `${p.id}_${item.label}`,
          originalLabel: item.label
        }));

        if (isShuffle) {
          shuffleArray(clonedItems);
        }

        clonedItems.forEach((it, idx) => {
          it.displayLabel = labels[idx];
        });

        return {
          ...p,
          items: clonedItems
        };
      });

      if (isShuffle) {
        shuffleArray(cloned);
      }

      activeTFData = cloned;
      tfAnswers = {};

      if (!silent) {
        showToast(`🎲 Đã xáo ngẫu nhiên 4 bài tư liệu & 16 ý Đúng/Sai (Lượt #${tfRoundCount})!`);
      }
    }

    function toggleShuffleTF() {
      autoShuffleTF = !autoShuffleTF;
      if (autoShuffleTF) {
        showToast('🔀 Đã BẬT tự xáo đáp án phần Đúng/Sai');
      } else {
        showToast('⏸ Đã TẮT tự xáo đáp án phần Đúng/Sai');
      }
      renderTrueFalse();
    }

    function shuffleTF() {
      tfRoundCount++;
      generateTFSession(true, false);
      renderTrueFalse();
    }

    function resetTFAnswers() {
      tfAnswers = {};
      showToast('🔄 Đã làm mới phần Đúng/Sai (Giữ nguyên thứ tự câu hiện tại)');
      renderTrueFalse();
    }

    function handleFinishAndNextRoundTF() {
      tfRoundCount++;
      generateTFSession(autoShuffleTF, false);
      renderTrueFalse();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderTrueFalse() {
      if (!activeTFData || activeTFData.length === 0) {
        generateTFSession(autoShuffleTF, true);
      }
      const quizArea = document.getElementById('quizArea');
      
      let totalAnswered = 0;
      let totalCorrect = 0;
      activeTFData.forEach(p => {
        p.items.forEach(it => {
          if (tfAnswers[it.uid] !== undefined) {
            totalAnswered++;
            if (tfAnswers[it.uid] === it.correct) {
              totalCorrect++;
            }
          }
        });
      });

      const progress = (totalAnswered / 16) * 100;
      document.getElementById('progressFill').style.width = progress + '%';
      document.getElementById('qCounter').innerText = `Đã làm: ${totalAnswered} / 16 ý`;
      document.getElementById('scoreCounter').innerText = `Đúng: ${totalCorrect} / 16`;
      const tag = document.getElementById('examCodeTag');
      if (tag) tag.innerText = `Đúng/Sai • Lượt #${tfRoundCount}`;

      let html = `
        <div style="display:flex; justify-content:space-between; align-items:center; background:var(--card-bg); border:1px solid var(--card-border); padding:12px 18px; border-radius:var(--radius-sm); margin-bottom:18px; flex-wrap:wrap; gap:10px;">
          <div>
            <span style="font-size:14px; font-weight:700; color:var(--primary-light);">⚖️ Phần II: Đúng / Sai (16 ý)</span>
            <span style="font-size:12px; color:var(--text-muted); margin-left:8px;">(Lượt thi #${tfRoundCount})</span>
          </div>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button class="control-btn ${autoShuffleTF ? 'active' : ''}" onclick="toggleShuffleTF()">
              🔀 ${autoShuffleTF ? 'Tự xáo ý: BẬT' : 'Tự xáo ý: TẮT'}
            </button>
            <button class="control-btn" onclick="shuffleTF()">🎲 Xáo đề ngay</button>
            <button class="control-btn" onclick="resetTFAnswers()">🔄 Làm lại</button>
          </div>
        </div>
      `;

      activeTFData.forEach((passage, pIdx) => {
        let itemsHtml = '';
        passage.items.forEach(item => {
          const userVal = tfAnswers[item.uid];
          const answered = userVal !== undefined;

          let btnTrueCls = '';
          let btnFalseCls = '';

          if (answered) {
            if (item.correct === true) {
              btnTrueCls = 'selected-correct';
              if (userVal === false) btnFalseCls = 'selected-wrong';
            } else {
              btnFalseCls = 'selected-correct';
              if (userVal === true) btnTrueCls = 'selected-wrong';
            }
          }

          itemsHtml += `
            <div class="tf-item">
              <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
                <div class="tf-text"><b>${item.displayLabel})</b> ${item.text}</div>
                <div style="font-size:11px; color:var(--text-muted); font-weight:600; white-space:nowrap; padding-top:2px;">(Gốc: ý ${item.originalLabel})</div>
              </div>
              <div class="tf-actions">
                <button class="tf-btn ${btnTrueCls}" onclick="handleTFSelect('${item.uid}', true)" ${answered ? 'disabled' : ''}>
                  ✔ ĐÚNG
                </button>
                <button class="tf-btn ${btnFalseCls}" onclick="handleTFSelect('${item.uid}', false)" ${answered ? 'disabled' : ''}>
                  ✖ SAI
                </button>
              </div>
              ${answered ? `<div style="font-size:13px; color:#cbd5e1; margin-top:4px; padding-top:6px; border-top:1px dashed rgba(255,255,255,0.1);">💡 <b>Giải thích:</b> ${item.explain}</div>` : ''}
            </div>
          `;
        });

        html += `
          <div class="card">
            <div class="q-number">Bài ${pIdx + 1}: ${passage.title}</div>
            <div class="passage-box">
              ${passage.passage}
              <div class="passage-source">${passage.source}</div>
            </div>
            ${itemsHtml}
          </div>
        `;
      });

      if (totalAnswered === 16) {
        const percent = Math.round((totalCorrect / 16) * 100);
        html += `
          <div class="card result-box" style="margin-top:20px; border: 1.5px solid var(--primary-light); background: linear-gradient(135deg, rgba(30,41,59,0.9), rgba(49,46,129,0.3));">
            <div style="display:inline-block; font-size:13px; color:var(--primary-light); font-weight:700; margin-bottom:8px; text-transform:uppercase; letter-spacing:0.5px; background:rgba(79,70,229,0.2); padding:4px 14px; border-radius:999px;">
              🏁 Hoàn thành Phần Đúng / Sai (Lượt #${tfRoundCount})
            </div>
            <div class="result-score">${totalCorrect}/16</div>
            <div class="result-title">${totalCorrect >= 14 ? 'Quá xuất sắc! 🌟' : totalCorrect >= 10 ? 'Kết quả rất tốt! 👏' : 'Cần cố gắng thêm một chút! 💪'}</div>
            <div class="result-desc">
              Điểm quy đổi: <b style="color:var(--accent); font-size:17px;">${((totalCorrect / 16) * 4).toFixed(2)} / 4.0 điểm</b> (Chính xác ${percent}%)
            </div>
            <div style="background:rgba(255,255,255,0.03); border:1px solid var(--card-border); border-radius:var(--radius-sm); padding:12px; margin-bottom:20px; font-size:13.5px; color:var(--text-muted);">
              ${autoShuffleTF 
                ? '✨ <b>Chế độ Tự xáo đáp án Đúng/Sai đang BẬT:</b> Bấm nút dưới để tự động xáo lại toàn bộ 4 bài tư liệu & 16 ý a, b, c, d cho lượt làm mới!' 
                : '⏸ <b>Chế độ Tự xáo đáp án Đúng/Sai đang TẮT:</b> Giữ nguyên thứ tự hiện tại.'}
            </div>
            <div style="display:flex; justify-content:center; gap:12px; flex-wrap:wrap;">
              <button class="btn btn-primary" onclick="handleFinishAndNextRoundTF()">
                🎲 ${autoShuffleTF ? 'Xáo đề ngẫu nhiên & Làm lượt mới ➡' : 'Làm lại lượt mới ➡'}
              </button>
              <button class="btn btn-outline" onclick="resetTFAnswers()">🔄 Làm lại lượt hiện tại</button>
              <button class="btn btn-outline" onclick="switchTab('quiz')">Quay lại Trắc nghiệm 24 câu ➡</button>
            </div>
          </div>
        `;
      }

      quizArea.innerHTML = html;
    }

    function handleTFSelect(itemUid, val) {
      tfAnswers[itemUid] = val;

      let foundItem = null;
      for (const p of activeTFData) {
        const it = p.items.find(x => x.uid === itemUid);
        if (it) { foundItem = it; break; }
      }

      if (foundItem) {
        if (val === foundItem.correct) {
          playSound('correct');
        } else {
          playSound('wrong');
        }
      }

      renderTrueFalse();
    }

    function renderFlashcards() {
      const quizArea = document.getElementById('quizArea');
      let cardsHtml = '';

      FLASHCARD_DATA.forEach((item, index) => {
        cardsHtml += `
          <div class="keyword-card" onclick="this.classList.toggle('revealed')">
            <div class="kw-q">❓ <b>Câu ${index + 1}:</b> ${item.q}</div>
            <div class="kw-a">👉 <span>${item.a}</span></div>
          </div>
        `;
      });

      quizArea.innerHTML = `
        <div class="card">
          <h2 style="font-family:'Outfit'; font-size:18px; margin-bottom:6px; color:var(--accent);">⚡ Bảng Bí Kíp Neo Từ Khóa (Thuộc Lầu 3 Phút)</h2>
          <p style="color:var(--text-muted); font-size:14px; margin-bottom:16px;">
            Đọc câu hỏi bên trên và chỉ cần nhớ ngay cụm từ khóa in vàng bên dưới. Dù đề có bị trộn 100 mã thì nhìn thấy từ khóa là khoanh chuẩn 100%!
          </p>
          <div class="flashcard-deck">
            ${cardsHtml}
          </div>
        </div>
      `;
    }

    function renderMistakes() {
      const quizArea = document.getElementById('quizArea');
      if (mistakeList.length === 0) {
        quizArea.innerHTML = `
          <div class="card" style="text-align:center; padding:40px 20px;">
            <div style="font-size:48px; margin-bottom:12px;">🎉</div>
            <h2 style="font-family:'Outfit'; font-size:20px; margin-bottom:8px;">Tuyệt vời! Bạn chưa làm sai câu nào</h2>
            <p style="color:var(--text-muted); font-size:14px; margin-bottom:20px;">Hãy tiếp tục thử sức với các phần khác để duy trì phong độ nhé!</p>
            <button class="btn btn-primary" onclick="switchTab('quiz')">Quay lại làm trắc nghiệm</button>
          </div>
        `;
        return;
      }

      let itemsHtml = '';
      mistakeList.forEach(id => {
        const q = QUIZ_DATA.find(x => x.id === id);
        itemsHtml += `
          <div class="keyword-card" style="border-left: 3px solid var(--danger);">
            <div style="font-size:13px; font-weight:700; color:var(--danger); margin-bottom:4px;">CÂU ${q.id} (ĐÃ CHỌN SAI)</div>
            <div style="font-size:15px; font-weight:600; margin-bottom:8px;">${q.question}</div>
            <div style="font-size:14px; color:#a7f3d0; margin-bottom:6px;"><b>✔ Đáp án đúng:</b> ${q.options[q.answer]}</div>
            <div style="font-size:13px; color:#cbd5e1; background:rgba(0,0,0,0.2); padding:8px 12px; border-radius:6px;"><b>💡 Ghi nhớ:</b> ${q.explain}</div>
          </div>
        `;
      });

      quizArea.innerHTML = `
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
            <h2 style="font-family:'Outfit'; font-size:18px; color:var(--danger);">Danh sách ${mistakeList.length} câu bạn vừa làm sai</h2>
            <button class="btn btn-outline" style="padding:6px 12px; font-size:12px;" onclick="mistakeList=[]; document.getElementById('mistakeTab').innerText='🔄 Câu Làm Sai (0)'; renderMistakes();">Xóa danh sách</button>
          </div>
          <div class="flashcard-deck">
            ${itemsHtml}
          </div>
        </div>
      `;
    }
  </script>
  <div class="toast" id="toast"></div>
</body>
</html>
